<!-- Schéma du mapping des sourcils (repères A, B, C) — SVG inline à coller tel quel.
     Largeur conseillée : 90 à 130 mm. -->
<svg class="schema-mapping" viewBox="0 0 520 345" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mapping des sourcils : A début, B arche, C queue, projetés depuis l'aile du nez">
  <style>
    .schema-mapping .face { fill: none; stroke: #A48A7B; stroke-width: 1.2; }
    .schema-mapping .brow { fill: #3B2823; opacity: .85; }
    .schema-mapping .eye { fill: #FCFAF7; stroke: #3B2823; stroke-width: 1.3; }
    .schema-mapping .iris { fill: #A48A7B; }
    .schema-mapping .pupil { fill: #3B2823; }
    .schema-mapping .nose { fill: none; stroke: #3B2823; stroke-width: 1.3; stroke-linecap: round; }
    .schema-mapping .line-a { stroke: #7A2430; stroke-width: 1.4; }
    .schema-mapping .line-b { stroke: #7A2430; stroke-width: 1.4; stroke-dasharray: 7 4; }
    .schema-mapping .line-c { stroke: #7A2430; stroke-width: 1.6; stroke-dasharray: 1.5 4; stroke-linecap: round; }
    .schema-mapping .dot { fill: #7A2430; }
    .schema-mapping .dot-ring { fill: #FCFAF7; stroke: #7A2430; stroke-width: 1.4; }
    .schema-mapping .lbl { font-family: 'Bodoni Moda', serif; font-style: italic; font-size: 24px; fill: #7A2430; }
  </style>

  <!-- contour du visage -->
  <path class="face" d="M30 26 C30 230 110 342 260 342 C410 342 490 230 490 26"/>

  <!-- sourcils -->
  <path class="brow" d="M210 124 C209 116 208 110 206 104 C178 92 138 81 101 80 C80 80 60 88 48 100 C64 95 84 92 102 93 C140 95 178 106 210 124 Z"/>
  <path class="brow" d="M310 124 C311 116 312 110 314 104 C342 92 382 81 419 80 C440 80 460 88 472 100 C456 95 436 92 418 93 C380 95 342 106 310 124 Z"/>

  <!-- yeux -->
  <path class="eye" d="M98 152 C122 130 188 130 212 152 C188 170 122 170 98 152 Z"/>
  <circle class="iris" cx="160" cy="151" r="15"/><circle class="pupil" cx="160" cy="151" r="6"/>
  <path class="eye" d="M308 152 C332 130 398 130 422 152 C398 170 332 170 308 152 Z"/>
  <circle class="iris" cx="360" cy="151" r="15"/><circle class="pupil" cx="360" cy="151" r="6"/>

  <!-- nez -->
  <path class="nose" d="M246 160 C246 215 242 255 236 278 C230 294 240 306 252 299 M274 160 C274 215 278 255 284 278 C290 294 280 306 268 299 M252 299 C256 305 264 305 268 299"/>

  <!-- A : aile du nez -> coin interne de l'œil -> début -->
  <path class="line-a" d="M232 292 L199 58"/><path class="line-a" d="M288 292 L321 58"/>
  <!-- B : aile du nez -> bord externe de l'iris -> arche -->
  <path class="line-b" d="M232 292 L82 50"/><path class="line-b" d="M288 292 L438 50"/>
  <!-- C : aile du nez -> coin externe de l'œil -> queue -->
  <path class="line-c" d="M232 292 L29 80"/><path class="line-c" d="M288 292 L491 80"/>

  <circle class="dot-ring" cx="232" cy="292" r="5"/><circle class="dot-ring" cx="288" cy="292" r="5"/>
  <circle class="dot" cx="206" cy="112" r="4.5"/><circle class="dot" cx="314" cy="112" r="4.5"/>
  <circle class="dot" cx="101" cy="82" r="4.5"/><circle class="dot" cx="419" cy="82" r="4.5"/>
  <circle class="dot" cx="48" cy="100" r="4.5"/><circle class="dot" cx="472" cy="100" r="4.5"/>

  <text class="lbl" x="196" y="46" text-anchor="middle">A</text><text class="lbl" x="324" y="46" text-anchor="middle">A</text>
  <text class="lbl" x="76" y="40" text-anchor="middle">B</text><text class="lbl" x="444" y="40" text-anchor="middle">B</text>
  <text class="lbl" x="20" y="72" text-anchor="middle">C</text><text class="lbl" x="500" y="72" text-anchor="middle">C</text>
</svg>
